events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version
    server_tokens off;

    # Security headers applied at the HTTP level (before server blocks)
    # CSP is also set by Django middleware; these are additional defaults

    upstream django_upstream {
        server django:8000;
    }

    upstream fastapi_upstream {
        server fastapi:8001;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        # ── Security Headers ─────────────────────────────────
        # HSTS is set by Django in production; these are baseline headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self), payment=(), usb=()" always;

        # ── Static files ─────────────────────────────────────
        location /static/ {
            alias /staticfiles/;
            expires 7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Media files (protected; direct access discouraged) ─
        location /media/ {
            alias /media/;
            internal;  # Only accessible through internal redirects
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ── Django API ───────────────────────────────────────
        location /api/ {
            proxy_pass http://django_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Limit request body size for API
            client_max_body_size 10M;
        }

        # ── AI Service ───────────────────────────────────────
        location /ai/ {
            proxy_pass http://fastapi_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts — AI inference can be slow
            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;

            # Limit request body size for AI endpoints
            client_max_body_size 50M;
        }

        # ── Blocked internal services ────────────────────────
        location /mlflow/ {
            return 503 "MLflow service is not running in the core profile.\n";
        }

        location /grafana/ {
            return 503 "Grafana service is not running in the core profile.\n";
        }

        # ── Deny dotfiles ────────────────────────────────────
        location ~ /\. {
            deny all;
            return 404;
        }

        # ── Django app ───────────────────────────────────────
        location / {
            proxy_pass http://django_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
