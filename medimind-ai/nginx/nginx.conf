events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    upstream django_upstream {
        server django:8000;
    }

    upstream fastapi_upstream {
        server fastapi:8001;
    }

    # Keep port 80 available for non-disruptive Certbot webroot renewals. All
    # other plaintext traffic is permanently redirected to the same HTTPS URI.
    server {
        listen 80;
        listen [::]:80;
        server_name medimind-ai.online www.medimind-ai.online app.medimind-ai.online;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name app.medimind-ai.online;

        ssl_certificate /etc/letsencrypt/live/app.medimind-ai.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.medimind-ai.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 50M;

        # Nginx owns these headers for HTTPS responses, including static files.
        # Hide matching upstream headers to avoid duplicate values from Django.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self), payment=(), usb=()" always;

        location /static/ {
            alias /staticfiles/;
            expires 7d;
        }

        # The serverless wake controller follows this endpoint and redirects a
        # visitor only after Django, PostgreSQL, FastAPI, and every required
        # production model report ready.
        location = /readyz {
            proxy_pass http://django_upstream/readyz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 20s;
        }

        # Uploaded medical files remain protected. Legitimate downloads are
        # streamed through Django's authenticated report-download view.
        location /media/ {
            alias /media/;
            internal;
        }

        location = /api/reports/upload/ {
            proxy_pass http://django_upstream/api/reports/upload/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Original-URI $request_uri;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50M;
        }

        location /api/ {
            proxy_pass http://django_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Original-URI $request_uri;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50M;
        }

        location /ai/ {
            proxy_pass http://fastapi_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # External clients cannot forge the deployment-only activity bypass.
            proxy_set_header X-MediMind-Internal-Check "";

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50M;
        }

        # These internal observability services are intentionally not exposed.
        location /mlflow/ {
            return 503 "MLflow is not publicly exposed.\n";
        }

        location /grafana/ {
            return 503 "Grafana is not publicly exposed.\n";
        }

        location ~ /\. {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://django_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 30s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
