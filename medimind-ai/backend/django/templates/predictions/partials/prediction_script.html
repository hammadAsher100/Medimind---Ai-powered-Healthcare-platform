<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.querySelector(".prediction-form");
  if (!form) return;
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!form.reportValidity()) return;
    const submitButton = form.querySelector('button[type="submit"]');
    const disease = form.dataset.disease;
    const data = {};
    new FormData(form).forEach((value, key) => {
      const input = form.elements[key];
      if (input && input.type === "number") data[key] = Number(value);
      else if (["hypertension","heart_disease"].includes(key) && disease === "stroke") data[key] = Number(value);
      else data[key] = value;
    });
    if (submitButton) {
      submitButton.disabled = true;
      submitButton.setAttribute("aria-busy", "true");
    }
    showLoading("Analyzing your risk factors...");
    try {
      const result = await API.post(`/predictions/predict/${disease}/`, data);
      sessionStorage.setItem("prediction_result", JSON.stringify(result));
      sessionStorage.setItem("prediction_input", JSON.stringify(data));
      window.location.href = "/predictions/result/";
    } catch (error) {
      notify.error(error.message || "Risk analysis failed. Check your entries and try again.");
    } finally {
      hideLoading();
      if (submitButton) {
        submitButton.disabled = false;
        submitButton.removeAttribute("aria-busy");
      }
    }
  });
});
</script>
