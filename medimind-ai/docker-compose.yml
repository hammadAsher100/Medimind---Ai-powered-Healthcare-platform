services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - medimind_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - medimind_network

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    env_file: .env
    command: >
      sh -c "mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}
             --default-artifact-root $${MLFLOW_ARTIFACT_ROOT:-/mlartifacts}"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medimind_network

  django:
    image: hammadasher/medimind-django:latest
    build:
      context: .
      dockerfile: docker/django.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: medimind.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      FASTAPI_URL: http://fastapi:8001
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn medimind.wsgi:application --bind=0.0.0.0:8000 --workers=2 --timeout=180"]
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),10); s.close()"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - medimind_network

  fastapi:
    image: hammadasher/medimind-fastapi:latest
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_BASE_DIR: /opt/medimind/models
      CNN_PNEUMONIA_MODEL_PATH: ${CNN_PNEUMONIA_MODEL_PATH:-/opt/medimind/models/pneumonia/cnn_pneumonia.h5}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      CUDA_VISIBLE_DEVICES: ""
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_ENABLE_ONEDNN_OPTS: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      ENABLE_SHAP_EXPLANATIONS: "False"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    volumes:
      - /opt/medimind/models:/opt/medimind/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),10); s.close()"]
      interval: 20s
      timeout: 15s
      retries: 20
      start_period: 180s
    networks:
      - medimind_network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - fastapi
      - django
    networks:
      - medimind_network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - medimind_network

  nginx:
    image: hammadasher/medimind-nginx:latest
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - django_static:/staticfiles:ro
      - django_media:/media:ro
    depends_on:
      - django
      - fastapi
    networks:
      - medimind_network

networks:
  medimind_network:
    driver: bridge

volumes:
  pgdata:
  qdrant_storage:
  mlflow_artifacts:
  grafana_data:
  django_static:
  django_media:
