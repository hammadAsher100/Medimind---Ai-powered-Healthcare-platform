name: AWS CI CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: medimind-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  COMPOSE_DIRECTORY: medimind-ai
  DOCKERHUB_NAMESPACE: hammadasher

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${COMPOSE_DIRECTORY}/docker-compose.yml"
          test -f "${COMPOSE_DIRECTORY}/.env.example"
          test -f "${COMPOSE_DIRECTORY}/docker/fastapi.Dockerfile"
          test -f "${COMPOSE_DIRECTORY}/docker/django.Dockerfile"
          test -f "${COMPOSE_DIRECTORY}/docker/nginx.Dockerfile"
          test -f "${COMPOSE_DIRECTORY}/nginx/nginx.conf"

      - name: Create validation environment
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        shell: bash
        run: cp .env.example .env

      - name: Validate Docker Compose
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        shell: bash
        run: docker compose config --quiet

      - name: Validate production Nginx configuration
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          CERT_ROOT=$(mktemp -d)
          mkdir -p "$CERT_ROOT/live/app.medimind-ai.online"
          mkdir -p "$CERT_ROOT/live/medimind-ai.online"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=medimind-ai.online" \
            -keyout "$CERT_ROOT/live/medimind-ai.online/privkey.pem" \
            -out "$CERT_ROOT/live/medimind-ai.online/fullchain.pem"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=app.medimind-ai.online" \
            -keyout "$CERT_ROOT/live/app.medimind-ai.online/privkey.pem" \
            -out "$CERT_ROOT/live/app.medimind-ai.online/fullchain.pem"
          docker run --rm \
            --add-host django:127.0.0.1 \
            --add-host fastapi:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$CERT_ROOT:/etc/letsencrypt:ro" \
            nginx:1.25-alpine nginx -t

      - name: Test on-demand control plane
        shell: bash
        run: python -m unittest discover -s infrastructure/on-demand/tests -v

      - name: Validate on-demand CloudFormation templates
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'cfn-lint>=1.39,<2'
          cfn-lint \
            infrastructure/on-demand/dns-template.yaml \
            infrastructure/on-demand/template.yaml \
            infrastructure/on-demand/edge-template.yaml

  build-and-push:
    name: Build and Push Images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DOCKER_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/fastapi.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-fastapi:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-fastapi:${{ github.sha }}
          cache-from: type=gha,scope=medimind-fastapi
          cache-to: type=gha,mode=max,scope=medimind-fastapi

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/django.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-django:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-django:${{ github.sha }}
          cache-from: type=gha,scope=medimind-django
          cache-to: type=gha,mode=max,scope=medimind-django

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/nginx.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-nginx:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-nginx:${{ github.sha }}
          cache-from: type=gha,scope=medimind-nginx
          cache-to: type=gha,mode=max,scope=medimind-nginx

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.AWS_ROLE_ARN }}"
          test -n "${{ vars.AWS_REGION }}"
          test -n "${{ vars.EC2_INSTANCE_ID }}"
          test -n "${{ vars.S3_BUCKET }}"
          test -n "${{ vars.S3_PREFIX }}"
          if [ "${{ vars.ON_DEMAND_DEPLOYMENT_ENABLED }}" = "true" ]; then
            test -n "${{ vars.ACTIVITY_TABLE_NAME }}"
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: medimind-github-deployment

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Prepare EC2 power state and deployment lease
        id: power
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ON_DEMAND_ENABLED: ${{ vars.ON_DEMAND_DEPLOYMENT_ENABLED }}
          ACTIVITY_TABLE_NAME: ${{ vars.ACTIVITY_TABLE_NAME }}
        run: |
          set -euo pipefail

          DEPLOYMENT_STARTED_AT=$(date +%s)
          echo "deployment_started_at=$DEPLOYMENT_STARTED_AT" >> "$GITHUB_OUTPUT"

          # Preserve the existing deployment behavior until the on-demand stack
          # and its least-privilege EC2 permissions have been enabled.
          if [ "$ON_DEMAND_ENABLED" != "true" ]; then
            echo "initial_state=running" >> "$GITHUB_OUTPUT"
            echo "On-demand power management is disabled; expecting the existing EC2 host to be running"
            for attempt in $(seq 1 90); do
              STATUS=$(aws ssm describe-instance-information \
                --region "$AWS_DEPLOY_REGION" \
                --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text 2>/dev/null || echo Offline)
              echo "Systems Manager attempt $attempt: $STATUS"
              [ "$STATUS" = "Online" ] && exit 0
              sleep 10
            done
            echo "Systems Manager did not become available on the existing EC2 host"
            exit 1
          fi

          INITIAL_STATE=$(aws ec2 describe-instances \
            --region "$AWS_DEPLOY_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "initial_state=$INITIAL_STATE" >> "$GITHUB_OUTPUT"
          echo "Initial EC2 state: $INITIAL_STATE"

          case "$INITIAL_STATE" in
            stopped)
              aws ec2 start-instances --region "$AWS_DEPLOY_REGION" --instance-ids "$EC2_INSTANCE_ID" >/dev/null
              ;;
            stopping)
              aws ec2 wait instance-stopped --region "$AWS_DEPLOY_REGION" --instance-ids "$EC2_INSTANCE_ID"
              aws ec2 start-instances --region "$AWS_DEPLOY_REGION" --instance-ids "$EC2_INSTANCE_ID" >/dev/null
              ;;
            pending|running)
              ;;
            shutting-down|terminated)
              echo "The configured EC2 instance cannot be deployed in state $INITIAL_STATE"
              exit 1
              ;;
            *)
              echo "Unexpected EC2 state: $INITIAL_STATE"
              exit 1
              ;;
          esac

          aws ec2 wait instance-running --region "$AWS_DEPLOY_REGION" --instance-ids "$EC2_INSTANCE_ID"

          if [ "$ON_DEMAND_ENABLED" = "true" ]; then
            DEPLOYMENT_UNTIL=$((DEPLOYMENT_STARTED_AT + 3600))
            aws dynamodb update-item \
              --region "$AWS_DEPLOY_REGION" \
              --table-name "$ACTIVITY_TABLE_NAME" \
              --key "{\"pk\":{\"S\":\"INSTANCE#$EC2_INSTANCE_ID\"},\"sk\":{\"S\":\"STATE\"}}" \
              --update-expression 'SET deployment_until = :until, deployment_started_at = :started, updated_at = :started' \
              --expression-attribute-values "{\":until\":{\"N\":\"$DEPLOYMENT_UNTIL\"},\":started\":{\"N\":\"$DEPLOYMENT_STARTED_AT\"}}" >/dev/null
          fi

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm describe-instance-information \
              --region "$AWS_DEPLOY_REGION" \
              --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo Offline)
            echo "Systems Manager attempt $attempt: $STATUS"
            [ "$STATUS" = "Online" ] && exit 0
            sleep 10
          done
          echo "Systems Manager did not become available after EC2 startup"
          exit 1

      - name: Send deployment command
        id: deploy
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          DEPLOYED_COMMIT: ${{ github.sha }}
          ON_DEMAND_ENABLED: ${{ vars.ON_DEMAND_DEPLOYMENT_ENABLED }}
          ACTIVITY_TABLE_NAME: ${{ vars.ACTIVITY_TABLE_NAME }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -euxo pipefail

          export AWS_REGION="__AWS_REGION__"
          export AWS_DEFAULT_REGION="__AWS_REGION__"

          APP_ROOT="/opt/medimind/app"
          COMPOSE_DIR="$APP_ROOT/medimind-ai"
          MODEL_DIR="/opt/medimind/models"
          CERTBOT_CONF="/opt/medimind/certbot/conf"
          CERTBOT_WEBROOT="/opt/medimind/certbot/www"
          CERT_FULLCHAIN="$CERTBOT_CONF/live/app.medimind-ai.online/fullchain.pem"
          CERT_PRIVATE_KEY="$CERTBOT_CONF/live/app.medimind-ai.online/privkey.pem"
          LEGACY_CERT_FULLCHAIN="$CERTBOT_CONF/live/medimind-ai.online/fullchain.pem"
          LEGACY_CERT_PRIVATE_KEY="$CERTBOT_CONF/live/medimind-ai.online/privkey.pem"
          ENV_BACKUP="/tmp/medimind-production.env"

          mkdir -p "$MODEL_DIR" "$CERTBOT_WEBROOT/.well-known/acme-challenge"
          git config --system --add safe.directory "$APP_ROOT" || true

          if [ ! -d "$APP_ROOT/.git" ]; then
            if [ -d "$APP_ROOT" ] && [ -n "$(find "$APP_ROOT" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "$APP_ROOT exists but is not a Git checkout; refusing to overwrite it"
              exit 1
            fi
            git clone https://github.com/hammadAsher100/Medimind---Ai-powered-Healthcare-platform.git "$APP_ROOT"
          fi

          if [ -f "$COMPOSE_DIR/.env" ]; then
            cp "$COMPOSE_DIR/.env" "$ENV_BACKUP"
            chmod 600 "$ENV_BACKUP"
          fi

          cd "$APP_ROOT"
          git fetch origin main
          git reset --hard "__DEPLOYED_COMMIT__"
          git clean -fd

          if [ -f "$ENV_BACKUP" ]; then
            cp "$ENV_BACKUP" "$COMPOSE_DIR/.env"
            chmod 600 "$COMPOSE_DIR/.env"
          fi

          upsert_env() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" "$COMPOSE_DIR/.env"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$COMPOSE_DIR/.env"
            else
              printf '%s=%s\n' "$key" "$value" >> "$COMPOSE_DIR/.env"
            fi
          }

          if [ "__ON_DEMAND_ENABLED__" = "true" ]; then
            upsert_env ACTIVITY_TRACKING_ENABLED True
            upsert_env ACTIVITY_TABLE_NAME "__ACTIVITY_TABLE_NAME__"
            upsert_env EC2_INSTANCE_ID "__EC2_INSTANCE_ID__"
            upsert_env AWS_REGION "__AWS_REGION__"
            upsert_env CERTBOT_CERT_NAME app.medimind-ai.online
          fi

          test -f "$COMPOSE_DIR/.env"
          test "$(git rev-parse HEAD)" = "__DEPLOYED_COMMIT__"
          git log -1 --oneline

          echo "Verifying persistent Let's Encrypt certificate files"
          test -s "$CERT_FULLCHAIN"
          test -s "$CERT_PRIVATE_KEY"
          test -s "$LEGACY_CERT_FULLCHAIN"
          test -s "$LEGACY_CERT_PRIVATE_KEY"
          openssl x509 -in "$CERT_FULLCHAIN" -noout -subject -issuer -enddate
          openssl x509 -in "$CERT_FULLCHAIN" -noout -checkend 86400

          RENEWAL_CONFIG="$CERTBOT_CONF/renewal/medimind-ai.online.conf"
          if [ -f "$RENEWAL_CONFIG" ] && grep -Eq '^authenticator[[:space:]]*=[[:space:]]*standalone' "$RENEWAL_CONFIG"; then
            echo "WARNING: Certbot renewal is still configured for standalone mode."
            echo "Migrate it once to the documented webroot renewal command before certificate expiry."
          fi

          S3_OBJECT_COUNT=$(aws s3api list-objects-v2 \
            --region "$AWS_REGION" \
            --bucket "__S3_BUCKET__" \
            --prefix "__S3_PREFIX__/" \
            --query 'length(Contents || `[]`)' \
            --output text)

          echo "S3 bucket: __S3_BUCKET__"
          echo "S3 prefix: __S3_PREFIX__/"
          echo "S3 object count: $S3_OBJECT_COUNT"

          if [ "$S3_OBJECT_COUNT" -lt 10 ]; then
            echo "S3 model prefix is empty or incomplete"
            exit 1
          fi

          aws s3 sync \
            "s3://__S3_BUCKET__/__S3_PREFIX__/" \
            "$MODEL_DIR/" \
            --region "$AWS_REGION"

          find "$MODEL_DIR" -type d -exec chmod 755 {} \;
          find "$MODEL_DIR" -type f -exec chmod 644 {} \;

          for disease in diabetes heart kidney stroke; do
            test -r "$MODEL_DIR/$disease/model.joblib"
            test -r "$MODEL_DIR/$disease/scaler.joblib"
            test -r "$MODEL_DIR/$disease/feature_columns.json"
          done

          test -r "$MODEL_DIR/pneumonia/cnn_pneumonia.h5"

          cd "$COMPOSE_DIR"
          chmod 600 .env
          docker compose config --quiet
          bash ops/install-boot-services.sh

          deployment_failure() {
            failure_status=$?
            trap - ERR
            set +e
            echo "Deployment failed with exit code $failure_status"
            echo "Container status at failure"
            docker compose ps -a
            echo "Recent container logs"
            docker compose logs --no-color --timestamps --tail=250
            echo "Disk and Docker usage at failure"
            df -h /
            docker system df
            exit "$failure_status"
          }
          trap deployment_failure ERR

          echo "Disk and Docker usage before cleanup"
          df -h /
          docker system df || true

          echo "Stopping and removing the existing Compose application"
          docker compose down --remove-orphans --timeout 60

          echo "Removing only unused previous MediMind application images to make room"
          for image_ref in \
            __DOCKERHUB_NAMESPACE__/medimind-django:latest \
            __DOCKERHUB_NAMESPACE__/medimind-fastapi:latest \
            __DOCKERHUB_NAMESPACE__/medimind-nginx:latest; do
            if docker image inspect "$image_ref" >/dev/null 2>&1; then
              docker image rm "$image_ref"
            fi
          done
          docker image prune -f
          df -h /
          docker system df || true

          echo "Pulling the application images published by GitHub Actions"
          docker compose pull --quiet django fastapi nginx

          echo "Recreating the complete Compose application from the pulled images"
          docker compose up -d --no-build --force-recreate --remove-orphans

          echo "Waiting for PostgreSQL"
          for attempt in $(seq 1 30); do
            POSTGRES_CONTAINER=$(docker compose ps -q postgres)
            POSTGRES_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$POSTGRES_CONTAINER" 2>/dev/null || echo missing)
            echo "PostgreSQL attempt $attempt: $POSTGRES_HEALTH"
            [ "$POSTGRES_HEALTH" = "healthy" ] && break
            [ "$attempt" -eq 30 ] && docker compose logs --tail=200 postgres && exit 1
            sleep 5
          done

          echo "Waiting for Django and FastAPI"
          for attempt in $(seq 1 48); do
            DJANGO_CONTAINER=$(docker compose ps -q django)
            FASTAPI_CONTAINER=$(docker compose ps -q fastapi)

            DJANGO_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$DJANGO_CONTAINER" 2>/dev/null || echo missing)
            FASTAPI_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FASTAPI_CONTAINER" 2>/dev/null || echo missing)

            echo "Attempt $attempt: Django=$DJANGO_HEALTH FastAPI=$FASTAPI_HEALTH"

            if [ "$DJANGO_HEALTH" = "healthy" ] && [ "$FASTAPI_HEALTH" = "healthy" ]; then
              break
            fi

            if [ "$DJANGO_HEALTH" = "unhealthy" ]; then
              docker compose logs --tail=250 django
              exit 1
            fi

            if [ "$FASTAPI_HEALTH" = "unhealthy" ]; then
              docker compose logs --tail=250 fastapi
              exit 1
            fi

            if [ "$attempt" -eq 48 ]; then
              docker compose ps -a
              docker compose logs --tail=250 django
              docker compose logs --tail=250 fastapi
              exit 1
            fi

            sleep 10
          done

          echo "Checking production inference configuration"
          SHAP_SETTING=$(docker compose exec -T fastapi sh -c 'echo "$ENABLE_SHAP_EXPLANATIONS"' | tr -d '\r')
          echo "ENABLE_SHAP_EXPLANATIONS=$SHAP_SETTING"
          if [ "$SHAP_SETTING" != "False" ] && [ "$SHAP_SETTING" != "false" ]; then
            echo "SHAP must be disabled in production"
            exit 1
          fi

          echo "Checking production Django configuration"
          docker compose exec -T django python - <<'PY'
          import os
          from django.conf import settings

          settings_module = os.environ.get("DJANGO_SETTINGS_MODULE")
          print(f"DJANGO_SETTINGS_MODULE={settings_module}")
          print(f"DEBUG={settings.DEBUG}")
          assert settings_module == "medimind.settings.production"
          assert settings.DEBUG is False
          assert settings.SECURE_SSL_REDIRECT is True
          assert settings.SESSION_COOKIE_SECURE is True
          assert settings.CSRF_COOKIE_SECURE is True
          assert settings.SECURE_HSTS_SECONDS >= 300
          assert settings.SECURE_PROXY_SSL_HEADER == ("HTTP_X_FORWARDED_PROTO", "https")

          required_hosts = {"medimind-ai.online", "www.medimind-ai.online", "app.medimind-ai.online"}
          required_origins = {
              "https://medimind-ai.online",
              "https://www.medimind-ai.online",
              "https://app.medimind-ai.online",
          }
          assert required_hosts.issubset(set(settings.ALLOWED_HOSTS))
          assert required_origins.issubset(set(settings.CSRF_TRUSTED_ORIGINS))
          assert required_origins.issubset(set(settings.CORS_ALLOWED_ORIGINS))
          PY

          echo "Checking model mount"
          docker compose exec -T fastapi sh -lc 'test -r "$CNN_PNEUMONIA_MODEL_PATH"'

          if [ "__ON_DEMAND_ENABLED__" = "true" ]; then
            echo "Checking container access to the activity table through the EC2 role"
            docker compose exec -T django python - <<'PY'
          import os

          import boto3

          client = boto3.client("dynamodb", region_name=os.environ["AWS_REGION"])
          response = client.get_item(
              TableName=os.environ["ACTIVITY_TABLE_NAME"],
              Key={
                  "pk": {"S": f"INSTANCE#{os.environ['EC2_INSTANCE_ID']}"},
                  "sk": {"S": "STATE"},
              },
              ConsistentRead=True,
          )
          assert response["ResponseMetadata"]["HTTPStatusCode"] == 200
          print("Activity-table access passed")
          PY
          fi

          for disease in diabetes heart kidney stroke; do
            docker compose exec -T fastapi test -r "/opt/medimind/models/$disease/model.joblib"
            docker compose exec -T fastapi test -r "/opt/medimind/models/$disease/scaler.joblib"
            docker compose exec -T fastapi test -r "/opt/medimind/models/$disease/feature_columns.json"
          done

          echo "Running deployed model smoke tests"
          docker compose exec -T fastapi python -u - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import sys

          tests = {
              "diabetes": {
                  "glucose": 120,
                  "blood_pressure": 80,
                  "skin_thickness": 25,
                  "insulin": 90,
                  "bmi": 28.5,
                  "diabetes_pedigree_function": 0.45,
                  "age": 35,
                  "pregnancies": 2
              },
              "heart": {
                  "age": 52,
                  "sex": 1,
                  "chest_pain_type": 2,
                  "resting_bp": 130,
                  "cholesterol": 220,
                  "fasting_blood_sugar": 0,
                  "resting_ecg": 1,
                  "max_heart_rate": 150,
                  "exercise_angina": 0,
                  "st_depression": 1.2,
                  "st_slope": 1,
                  "num_major_vessels": 0,
                  "thal": 2
              },
              "kidney": {
                  "age": 45,
                  "blood_pressure": 80,
                  "specific_gravity": 1.02,
                  "albumin": 0,
                  "sugar": 0,
                  "red_blood_cells": "normal",
                  "pus_cell": "normal",
                  "pus_cell_clumps": "notpresent",
                  "bacteria": "notpresent",
                  "blood_glucose_random": 110,
                  "blood_urea": 30,
                  "serum_creatinine": 1.0,
                  "sodium": 140,
                  "potassium": 4.5,
                  "hemoglobin": 14.5,
                  "packed_cell_volume": 44,
                  "white_blood_cell_count": 7800,
                  "red_blood_cell_count": 5.0,
                  "hypertension": "no",
                  "diabetes_mellitus": "no",
                  "coronary_artery_disease": "no",
                  "appetite": "good",
                  "pedal_edema": "no",
                  "anemia": "no"
              },
              "stroke": {
                  "age": 50,
                  "hypertension": 0,
                  "heart_disease": 0,
                  "ever_married": "Yes",
                  "work_type": "Private",
                  "residence_type": "Urban",
                  "avg_glucose_level": 105.5,
                  "bmi": 27.2,
                  "smoking_status": "never smoked",
                  "gender": "Male"
              }
          }

          for disease, payload in tests.items():
              request = urllib.request.Request(
                  f"http://127.0.0.1:8001/predict/{disease}",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "X-MediMind-Internal-Check": "deployment"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = json.loads(response.read().decode())
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode()
                  print(f"HTTPError on {disease}: {e.code} {e.reason}", file=sys.stderr)
                  print(f"Error body: {error_body}", file=sys.stderr)
                  sys.exit(1)

              assert response.status == 200
              assert body["disease"] == disease
              assert "risk_percentage" in body
              assert "prediction" in body

              print(
                  disease,
                  "passed",
                  "risk=",
                  body["risk_percentage"],
                  "prediction=",
                  body["prediction"]
              )

          print("All deployed model smoke tests passed")
          PY

          echo "Validating Nginx and application health"
          docker compose exec -T nginx nginx -t

          docker compose exec -T fastapi python - <<'PY'
          import json
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=20) as response:
              body = json.loads(response.read().decode())
              assert response.status == 200
              print("FastAPI health:", body)
          PY

          docker compose exec -T django python - <<'PY'
          import http.client

          connection = http.client.HTTPConnection("127.0.0.1", 8000, timeout=20)
          connection.request(
              "GET",
              "/",
              headers={
                  "Host": "medimind-ai.online",
                  "X-Forwarded-Proto": "https",
              },
          )
          response = connection.getresponse()
          print("Django health status:", response.status)
          assert response.status in {200, 301, 302}
          connection.close()
          PY

          echo "Verifying HTTP redirects to HTTPS"
          REDIRECT_HEADERS=$(curl --silent --show-error --dump-header - --output /dev/null \
            --max-time 20 \
            --resolve app.medimind-ai.online:80:127.0.0.1 \
            http://app.medimind-ai.online/)
          echo "$REDIRECT_HEADERS"
          echo "$REDIRECT_HEADERS" | grep -Eq '^HTTP/[0-9.]+ 301'
          echo "$REDIRECT_HEADERS" | grep -Eiq '^location: https://app\.medimind-ai\.online/'

          echo "Verifying production HTTPS"
          HTTPS_STATUS="000"
          for attempt in $(seq 1 18); do
            HTTPS_STATUS=$(curl --silent --show-error --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 30 \
              --resolve app.medimind-ai.online:443:127.0.0.1 \
              https://app.medimind-ai.online/readyz || echo "000")
            echo "HTTPS attempt $attempt: $HTTPS_STATUS"

            case "$HTTPS_STATUS" in
              200|301|302)
                break
                ;;
            esac

            [ "$attempt" -eq 18 ] && docker compose logs --tail=250 nginx django && exit 1
            sleep 10
          done

          PUBLIC_HTTPS_STATUS=$(curl --silent --show-error --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            https://app.medimind-ai.online/readyz)
          echo "Public HTTPS status: $PUBLIC_HTTPS_STATUS"
          case "$PUBLIC_HTTPS_STATUS" in
            200|301|302) ;;
            *) docker compose logs --tail=250 nginx django; exit 1 ;;
          esac

          echo "Final container status"
          docker compose ps -a

          EXPECTED_SERVICES=$(docker compose config --services | sort)
          RUNNING_SERVICES=$(docker compose ps --services --filter status=running | sort)
          if [ "$RUNNING_SERVICES" != "$EXPECTED_SERVICES" ]; then
            echo "Not every configured service is running"
            echo "Expected services:"
            echo "$EXPECTED_SERVICES"
            echo "Running services:"
            echo "$RUNNING_SERVICES"
            exit 1
          fi

          echo "Final memory"
          free -h

          echo "Removing unused old images after successful health checks"
          docker image prune -a -f || echo "Warning: unused image cleanup failed"
          docker system df || true
          trap - ERR
          echo "Deployment completed successfully"
          SCRIPT
          )

          NORMALIZED_S3_BUCKET="${S3_BUCKET#s3://}"
          NORMALIZED_S3_BUCKET="${NORMALIZED_S3_BUCKET%/}"

          NORMALIZED_S3_PREFIX="${S3_PREFIX#/}"
          NORMALIZED_S3_PREFIX="${NORMALIZED_S3_PREFIX%/}"

          if [ -z "$NORMALIZED_S3_BUCKET" ]; then
            echo "S3_BUCKET is empty after normalization"
            exit 1
          fi

          if [ -z "$NORMALIZED_S3_PREFIX" ]; then
            echo "S3_PREFIX is empty after normalization"
            exit 1
          fi

          echo "Using S3 path: s3://${NORMALIZED_S3_BUCKET}/${NORMALIZED_S3_PREFIX}/"

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__AWS_REGION__/${AWS_DEPLOY_REGION}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__S3_BUCKET__/${NORMALIZED_S3_BUCKET}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__S3_PREFIX__/${NORMALIZED_S3_PREFIX}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__DEPLOYED_COMMIT__/${DEPLOYED_COMMIT}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__DOCKERHUB_NAMESPACE__/${DOCKERHUB_NAMESPACE}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ON_DEMAND_ENABLED__/${ON_DEMAND_ENABLED}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__ACTIVITY_TABLE_NAME__/${ACTIVITY_TABLE_NAME}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__EC2_INSTANCE_ID__/${EC2_INSTANCE_ID}}"

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_DEPLOY_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MediMind commit $DEPLOYED_COMMIT" \
            --timeout-seconds 1800 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command ID: $COMMAND_ID"

      - name: Wait for deployment result
        id: deployment_result
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_DEPLOY_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_DEPLOY_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Standard output"
                aws ssm get-command-invocation \
                  --region "$AWS_DEPLOY_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true
                echo "Standard error"
                aws ssm get-command-invocation \
                  --region "$AWS_DEPLOY_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Deployment did not finish within the expected time"
          exit 1

      - name: Release deployment lease and restore prior power state
        if: always()
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ON_DEMAND_ENABLED: ${{ vars.ON_DEMAND_DEPLOYMENT_ENABLED }}
          ACTIVITY_TABLE_NAME: ${{ vars.ACTIVITY_TABLE_NAME }}
          INITIAL_STATE: ${{ steps.power.outputs.initial_state }}
          DEPLOYMENT_STARTED_AT: ${{ steps.power.outputs.deployment_started_at }}
        run: |
          set -euo pipefail

          if [ -z "$INITIAL_STATE" ]; then
            echo "Power preparation did not complete; no state restoration is safe"
            exit 0
          fi

          RESTORE_STOPPED=false
          if [ "$INITIAL_STATE" = "stopped" ]; then
            RESTORE_STOPPED=true
          fi

          if [ "$ON_DEMAND_ENABLED" = "true" ] && [ -n "$ACTIVITY_TABLE_NAME" ]; then
            ITEM=$(aws dynamodb get-item \
              --region "$AWS_DEPLOY_REGION" \
              --table-name "$ACTIVITY_TABLE_NAME" \
              --key "{\"pk\":{\"S\":\"INSTANCE#$EC2_INSTANCE_ID\"},\"sk\":{\"S\":\"STATE\"}}" \
              --consistent-read \
              --query Item \
              --output json)

            LAST_ACTIVITY=$(jq -r '.last_activity_at.N // "0"' <<<"$ITEM")
            WAKE_REQUESTED=$(jq -r '.wake_requested_at.N // "0"' <<<"$ITEM")
            if [ "$LAST_ACTIVITY" -gt "$DEPLOYMENT_STARTED_AT" ] || [ "$WAKE_REQUESTED" -gt "$DEPLOYMENT_STARTED_AT" ]; then
              echo "Visitor activity occurred during deployment; keeping EC2 running"
              RESTORE_STOPPED=false
            fi

            aws dynamodb update-item \
              --region "$AWS_DEPLOY_REGION" \
              --table-name "$ACTIVITY_TABLE_NAME" \
              --key "{\"pk\":{\"S\":\"INSTANCE#$EC2_INSTANCE_ID\"},\"sk\":{\"S\":\"STATE\"}}" \
              --update-expression 'REMOVE deployment_until, deployment_started_at' >/dev/null
          fi

          if [ "$RESTORE_STOPPED" = "true" ]; then
            echo "Restoring the EC2 instance to its pre-deployment stopped state"
            aws ec2 stop-instances --region "$AWS_DEPLOY_REGION" --instance-ids "$EC2_INSTANCE_ID" >/dev/null
          else
            echo "Leaving EC2 running"
          fi
