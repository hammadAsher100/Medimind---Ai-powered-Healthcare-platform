name: AWS CI CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: medimind-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  COMPOSE_DIRECTORY: medimind-ai
  DOCKERHUB_NAMESPACE: hammadasher

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f "${COMPOSE_DIRECTORY}/docker-compose.yml"
          test -f "${COMPOSE_DIRECTORY}/.env.example"
          test -f "${COMPOSE_DIRECTORY}/docker/fastapi.Dockerfile"
          test -f "${COMPOSE_DIRECTORY}/docker/django.Dockerfile"
          test -f "${COMPOSE_DIRECTORY}/docker/nginx.Dockerfile"

      - name: Create validation environment
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        shell: bash
        run: cp .env.example .env

      - name: Validate Docker Compose
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        shell: bash
        run: docker compose config --quiet

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DOCKER_USERNAME }}"
          test -n "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/fastapi.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-fastapi:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-fastapi:${{ github.sha }}
          cache-from: type=gha,scope=medimind-fastapi
          cache-to: type=gha,mode=max,scope=medimind-fastapi

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/django.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-django:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-django:${{ github.sha }}
          cache-from: type=gha,scope=medimind-django
          cache-to: type=gha,mode=max,scope=medimind-django

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/nginx.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-nginx:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/medimind-nginx:${{ github.sha }}
          cache-from: type=gha,scope=medimind-nginx
          cache-to: type=gha,mode=max,scope=medimind-nginx

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Verify deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ vars.AWS_ROLE_ARN }}"
          test -n "${{ vars.AWS_REGION }}"
          test -n "${{ vars.EC2_INSTANCE_ID }}"
          test -n "${{ vars.S3_BUCKET }}"
          test -n "${{ vars.S3_PREFIX }}"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: medimind-github-deployment

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Verify EC2 Systems Manager connection
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          STATUS=$(aws ssm describe-instance-information \
            --region "$AWS_DEPLOY_REGION" \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)
          echo "Systems Manager status: $STATUS"
          test "$STATUS" = "Online"

      - name: Send deployment command
        id: deploy
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -euxo pipefail

          export AWS_REGION="__AWS_REGION__"
          export AWS_DEFAULT_REGION="__AWS_REGION__"

          APP_ROOT="/opt/medimind/app"
          COMPOSE_DIR="$APP_ROOT/medimind-ai"
          MODEL_DIR="/opt/medimind/models"
          ENV_BACKUP="/tmp/medimind-production.env"

          mkdir -p "$MODEL_DIR"
          chown -R ec2-user:ec2-user /opt/medimind
          git config --system --add safe.directory "$APP_ROOT" || true

          if [ ! -d "$APP_ROOT/.git" ]; then
            if [ -d "$APP_ROOT" ] && [ -n "$(find "$APP_ROOT" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "$APP_ROOT exists but is not a Git checkout; refusing to overwrite it"
              exit 1
            fi
            git clone https://github.com/hammadAsher100/Medimind---Ai-powered-Healthcare-platform.git "$APP_ROOT"
          fi

          if [ -f "$COMPOSE_DIR/.env" ]; then
            cp "$COMPOSE_DIR/.env" "$ENV_BACKUP"
            chmod 600 "$ENV_BACKUP"
          fi

          cd "$APP_ROOT"
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          if [ -f "$ENV_BACKUP" ]; then
            cp "$ENV_BACKUP" "$COMPOSE_DIR/.env"
            chmod 600 "$COMPOSE_DIR/.env"
          fi

          test -f "$COMPOSE_DIR/.env"
          git log -1 --oneline

          S3_OBJECT_COUNT=$(aws s3api list-objects-v2 \
            --region "$AWS_REGION" \
            --bucket "__S3_BUCKET__" \
            --prefix "__S3_PREFIX__/" \
            --query 'length(Contents || `[]`)' \
            --output text)

          echo "S3 bucket: __S3_BUCKET__"
          echo "S3 prefix: __S3_PREFIX__/"
          echo "S3 object count: $S3_OBJECT_COUNT"

          if [ "$S3_OBJECT_COUNT" -lt 10 ]; then
            echo "S3 model prefix is empty or incomplete"
            exit 1
          fi

          aws s3 sync \
            "s3://__S3_BUCKET__/__S3_PREFIX__/" \
            "$MODEL_DIR/" \
            --region "$AWS_REGION"

          find "$MODEL_DIR" -type d -exec chmod 755 {} \;
          find "$MODEL_DIR" -type f -exec chmod 644 {} \;

          for disease in diabetes heart kidney stroke; do
            test -r "$MODEL_DIR/$disease/model.joblib"
            test -r "$MODEL_DIR/$disease/scaler.joblib"
            test -r "$MODEL_DIR/$disease/feature_columns.json"
          done

          test -r "$MODEL_DIR/pneumonia/cnn_pneumonia.h5"

          cd "$COMPOSE_DIR"
          chmod 600 .env
          docker compose config --quiet

          deployment_failure() {
            failure_status=$?
            trap - ERR
            set +e
            echo "Deployment failed with exit code $failure_status"
            echo "Container status at failure"
            docker compose ps -a
            echo "Recent container logs"
            docker compose logs --no-color --timestamps --tail=250
            echo "Disk and Docker usage at failure"
            df -h /
            docker system df
            exit "$failure_status"
          }
          trap deployment_failure ERR

          echo "Disk and Docker usage before cleanup"
          df -h /
          docker system df || true

          echo "Stopping and removing the existing Compose application"
          docker compose down --remove-orphans --timeout 60

          echo "Pulling the application images published by GitHub Actions"
          docker compose pull django fastapi nginx

          echo "Recreating the complete Compose application from the pulled images"
          docker compose up -d --force-recreate --remove-orphans

          echo "Waiting for PostgreSQL"
          for attempt in $(seq 1 30); do
            POSTGRES_CONTAINER=$(docker compose ps -q postgres)
            POSTGRES_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$POSTGRES_CONTAINER" 2>/dev/null || echo missing)
            echo "PostgreSQL attempt $attempt: $POSTGRES_HEALTH"
            [ "$POSTGRES_HEALTH" = "healthy" ] && break
            [ "$attempt" -eq 30 ] && docker compose logs --tail=200 postgres && exit 1
            sleep 5
          done

          echo "Waiting for Django and FastAPI"
          for attempt in $(seq 1 48); do
            DJANGO_CONTAINER=$(docker compose ps -q django)
            FASTAPI_CONTAINER=$(docker compose ps -q fastapi)

            DJANGO_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$DJANGO_CONTAINER" 2>/dev/null || echo missing)
            FASTAPI_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$FASTAPI_CONTAINER" 2>/dev/null || echo missing)

            echo "Attempt $attempt: Django=$DJANGO_HEALTH FastAPI=$FASTAPI_HEALTH"

            if [ "$DJANGO_HEALTH" = "healthy" ] && [ "$FASTAPI_HEALTH" = "healthy" ]; then
              break
            fi

            if [ "$DJANGO_HEALTH" = "unhealthy" ]; then
              docker compose logs --tail=250 django
              exit 1
            fi

            if [ "$FASTAPI_HEALTH" = "unhealthy" ]; then
              docker compose logs --tail=250 fastapi
              exit 1
            fi

            if [ "$attempt" -eq 48 ]; then
              docker compose ps -a
              docker compose logs --tail=250 django
              docker compose logs --tail=250 fastapi
              exit 1
            fi

            sleep 10
          done

          echo "Checking production inference configuration"
          SHAP_SETTING=$(docker compose exec -T fastapi sh -c 'echo "$ENABLE_SHAP_EXPLANATIONS"' | tr -d '\r')
          echo "ENABLE_SHAP_EXPLANATIONS=$SHAP_SETTING"
          if [ "$SHAP_SETTING" != "False" ] && [ "$SHAP_SETTING" != "false" ]; then
            echo "SHAP must be disabled in production"
            exit 1
          fi

          echo "Checking production Django configuration"
          docker compose exec -T django python - <<'PY'
          import os
          from django.conf import settings

          settings_module = os.environ.get("DJANGO_SETTINGS_MODULE")
          print(f"DJANGO_SETTINGS_MODULE={settings_module}")
          print(f"DEBUG={settings.DEBUG}")
          assert settings_module == "medimind.settings.production"
          assert settings.DEBUG is False
          PY

          echo "Checking model mount"
          docker compose exec -T fastapi sh -lc 'test -r "$CNN_PNEUMONIA_MODEL_PATH"'

          for disease in diabetes heart kidney stroke; do
            docker compose exec -T fastapi test -r "/opt/medimind/models/$disease/model.joblib"
            docker compose exec -T fastapi test -r "/opt/medimind/models/$disease/scaler.joblib"
            docker compose exec -T fastapi test -r "/opt/medimind/models/$disease/feature_columns.json"
          done

          echo "Running deployed model smoke tests"
          docker compose exec -T fastapi python -u - <<'PY'
          import json
          import urllib.request
          import urllib.error
          import sys

          tests = {
              "diabetes": {
                  "glucose": 120,
                  "blood_pressure": 80,
                  "skin_thickness": 25,
                  "insulin": 90,
                  "bmi": 28.5,
                  "diabetes_pedigree_function": 0.45,
                  "age": 35,
                  "pregnancies": 2
              },
              "heart": {
                  "age": 52,
                  "sex": 1,
                  "chest_pain_type": 2,
                  "resting_bp": 130,
                  "cholesterol": 220,
                  "fasting_blood_sugar": 0,
                  "resting_ecg": 1,
                  "max_heart_rate": 150,
                  "exercise_angina": 0,
                  "st_depression": 1.2,
                  "st_slope": 1,
                  "num_major_vessels": 0,
                  "thal": 2
              },
              "kidney": {
                  "age": 45,
                  "blood_pressure": 80,
                  "specific_gravity": 1.02,
                  "albumin": 0,
                  "sugar": 0,
                  "red_blood_cells": "normal",
                  "pus_cell": "normal",
                  "pus_cell_clumps": "notpresent",
                  "bacteria": "notpresent",
                  "blood_glucose_random": 110,
                  "blood_urea": 30,
                  "serum_creatinine": 1.0,
                  "sodium": 140,
                  "potassium": 4.5,
                  "hemoglobin": 14.5,
                  "packed_cell_volume": 44,
                  "white_blood_cell_count": 7800,
                  "red_blood_cell_count": 5.0,
                  "hypertension": "no",
                  "diabetes_mellitus": "no",
                  "coronary_artery_disease": "no",
                  "appetite": "good",
                  "pedal_edema": "no",
                  "anemia": "no"
              },
              "stroke": {
                  "age": 50,
                  "hypertension": 0,
                  "heart_disease": 0,
                  "ever_married": "Yes",
                  "work_type": "Private",
                  "residence_type": "Urban",
                  "avg_glucose_level": 105.5,
                  "bmi": 27.2,
                  "smoking_status": "never smoked",
                  "gender": "Male"
              }
          }

          for disease, payload in tests.items():
              request = urllib.request.Request(
                  f"http://127.0.0.1:8001/predict/{disease}",
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = json.loads(response.read().decode())
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode()
                  print(f"HTTPError on {disease}: {e.code} {e.reason}", file=sys.stderr)
                  print(f"Error body: {error_body}", file=sys.stderr)
                  sys.exit(1)

              assert response.status == 200
              assert body["disease"] == disease
              assert "risk_percentage" in body
              assert "prediction" in body

              print(
                  disease,
                  "passed",
                  "risk=",
                  body["risk_percentage"],
                  "prediction=",
                  body["prediction"]
              )

          print("All deployed model smoke tests passed")
          PY

          echo "Checking application"
          HTTP_STATUS="000"

          for attempt in $(seq 1 18); do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 20 http://localhost/ || echo "000")
            echo "HTTP attempt $attempt: $HTTP_STATUS"

            case "$HTTP_STATUS" in
              200|301|302)
                break
                ;;
            esac

            [ "$attempt" -eq 18 ] && docker compose logs --tail=200 nginx django && exit 1
            sleep 10
          done

          echo "Final container status"
          docker compose ps -a

          EXPECTED_SERVICES=$(docker compose config --services | sort)
          RUNNING_SERVICES=$(docker compose ps --services --filter status=running | sort)
          if [ "$RUNNING_SERVICES" != "$EXPECTED_SERVICES" ]; then
            echo "Not every configured service is running"
            echo "Expected services:"
            echo "$EXPECTED_SERVICES"
            echo "Running services:"
            echo "$RUNNING_SERVICES"
            exit 1
          fi

          echo "Final memory"
          free -h

          echo "Removing unused old images after successful health checks"
          docker image prune -a -f || echo "Warning: unused image cleanup failed"
          docker system df || true
          trap - ERR
          echo "Deployment completed successfully"
          SCRIPT
          )

          NORMALIZED_S3_BUCKET="${S3_BUCKET#s3://}"
          NORMALIZED_S3_BUCKET="${NORMALIZED_S3_BUCKET%/}"

          NORMALIZED_S3_PREFIX="${S3_PREFIX#/}"
          NORMALIZED_S3_PREFIX="${NORMALIZED_S3_PREFIX%/}"

          if [ -z "$NORMALIZED_S3_BUCKET" ]; then
            echo "S3_BUCKET is empty after normalization"
            exit 1
          fi

          if [ -z "$NORMALIZED_S3_PREFIX" ]; then
            echo "S3_PREFIX is empty after normalization"
            exit 1
          fi

          echo "Using S3 path: s3://${NORMALIZED_S3_BUCKET}/${NORMALIZED_S3_PREFIX}/"

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__AWS_REGION__/${AWS_DEPLOY_REGION}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__S3_BUCKET__/${NORMALIZED_S3_BUCKET}}"
          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__S3_PREFIX__/${NORMALIZED_S3_PREFIX}}"

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_DEPLOY_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MediMind commit $DEPLOYED_COMMIT" \
            --timeout-seconds 1800 \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command ID: $COMMAND_ID"

      - name: Wait for deployment result
        shell: bash
        env:
          AWS_DEPLOY_REGION: ${{ vars.AWS_REGION }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_DEPLOY_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_DEPLOY_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Standard output"
                aws ssm get-command-invocation \
                  --region "$AWS_DEPLOY_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true
                echo "Standard error"
                aws ssm get-command-invocation \
                  --region "$AWS_DEPLOY_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                sleep 10
                ;;
            esac
          done

          echo "Deployment did not finish within the expected time"
          exit 1
