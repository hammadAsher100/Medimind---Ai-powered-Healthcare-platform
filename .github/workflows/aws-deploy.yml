name: AWS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: medimind-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  COMPOSE_DIRECTORY: medimind-ai

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create validation environment
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        run: cp .env.example .env

      - name: Validate Docker Compose
        working-directory: ${{ env.COMPOSE_DIRECTORY }}
        run: docker compose config --quiet

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/fastapi.Dockerfile
          push: true
          tags: |
            hammadasher/medimind-fastapi:latest
            hammadasher/medimind-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Django image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/django.Dockerfile
          push: true
          tags: |
            hammadasher/medimind-django:latest
            hammadasher/medimind-django:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: medimind-ai
          file: medimind-ai/docker/nginx.Dockerfile
          push: true
          tags: |
            hammadasher/medimind-nginx:latest
            hammadasher/medimind-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify EC2 is registered with Systems Manager
        run: |
          STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${{ vars.EC2_INSTANCE_ID }}" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text)

          echo "SSM status: $STATUS"

          if [ "$STATUS" != "Online" ]; then
            echo "EC2 instance is not online in Systems Manager."
            exit 1
          fi

      - name: Send deployment command
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MediMind commit ${{ github.sha }}" \
            --timeout-seconds 1200 \
            --parameters 'commands=[
              "set -euo pipefail",
              "APP_ROOT=/opt/medimind/app",
              "COMPOSE_DIR=/opt/medimind/app/medimind-ai",
              "MODEL_DIR=/opt/medimind/models",
              "sudo mkdir -p $APP_ROOT $MODEL_DIR",
              "sudo chown -R ec2-user:ec2-user /opt/medimind",
              "if [ ! -d $APP_ROOT/.git ]; then git clone https://github.com/hammadAsher100/Medimind---Ai-powered-Healthcare-platform.git $APP_ROOT; fi",
              "cd $APP_ROOT",
              "git fetch origin main",
              "git reset --hard origin/main",
              "aws s3 sync s3://${{ vars.S3_BUCKET }}/${{ vars.S3_PREFIX }}/ $MODEL_DIR/ --delete",
              "find $MODEL_DIR -type d -exec chmod 755 {} \\;",
              "find $MODEL_DIR -type f -exec chmod 644 {} \\;",
              "cd $COMPOSE_DIR",
              "test -f .env",
              "docker compose config --quiet",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "sleep 40",
              "docker compose ps -a",
              "docker compose exec -T fastapi test -r /opt/medimind/models/pneumonia/resnet50_pneumonia.keras",
              "curl --fail --retry 10 --retry-delay 5 --max-time 20 http://localhost/",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command ID: $COMMAND_ID"

      - name: Wait for deployment result
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "{Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment did not complete within the expected time."
          exit 1
