name: AWS CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # IMPORTANT: If your ML files are needed INSIDE the docker image,
      # uncomment this step to download them from AWS S3 before building.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download ML Models from S3
        run: |
          aws s3 cp s3://your-medimind-models-bucket/ml_models/ ./medimind-ai/ai_service/ml_models/ --recursive
          aws s3 cp s3://your-medimind-models-bucket/ml/ ./medimind-ai/ml/ --recursive

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Compose Services
        run: |
          docker compose -f medimind-ai/docker-compose.yml build
          docker compose -f medimind-ai/docker-compose.yml push

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu # Change if you are using Amazon Linux (ec2-user)
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/medimind-ai
            # Pull the latest docker-compose.yml from git (assuming the repo is cloned on the server)
            git pull origin main
            
            # Pull the new images from Docker Hub
            docker compose -f medimind-ai/docker-compose.yml pull
            
            # Restart the services
            docker compose -f medimind-ai/docker-compose.yml up -d --remove-orphans
